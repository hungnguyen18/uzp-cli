name: Setup Repository Labels

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/labels.yml']

permissions:
  issues: write

jobs:
  setup-labels:
    name: Setup Repository Labels
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Labels
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const labels = [
              // Review gates (used by CODEOWNERS and branch protection)
              { name: 'security-review-required', color: 'd73a4a', description: 'Security-critical changes need owner review' },
              { name: 'needs-owner-review', color: 'b60205', description: 'Changes require repository owner review' },
              { name: 'ready-to-merge', color: '0e8a16', description: 'Approved and ready to merge' },
            ];

            const { data: existingLabels } = await github.rest.issues.listLabelsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });

            const existingLabelNames = existingLabels.map(label => label.name);

            for (const label of labels) {
              try {
                if (existingLabelNames.includes(label.name)) {
                  await github.rest.issues.updateLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name: label.name,
                    color: label.color,
                    description: label.description
                  });
                  console.log(`Updated label: ${label.name}`);
                } else {
                  await github.rest.issues.createLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name: label.name,
                    color: label.color,
                    description: label.description
                  });
                  console.log(`Created label: ${label.name}`);
                }
              } catch (error) {
                console.log(`Failed to process label ${label.name}:`, error.message);
              }
            }

            console.log('Label setup completed.');
